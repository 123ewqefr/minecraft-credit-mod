name: Build Minecraft Mod JAR

"on":
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 8
        uses: actions/setup-java@v4
        with:
          java-version: '8'
          distribution: 'temurin'

      - name: Setup Gradle 6.8.1
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '6.8.1'

      - name: Generate Gradle wrapper
        run: gradle wrapper --gradle-version=6.8.1

      - name: Pre-create ForgeGradle MCP cache directories
        # ForgeGradle 4.x does not create parent directories before writing the
        # obf_to_srg.tsrg file, causing a NoSuchFileException on a clean runner.
        run: |
          mkdir -p ~/.gradle/caches/forge_gradle/mcp_repo/de/oceanlabs/mcp/mcp_config/1.16.5
          mkdir -p ~/.gradle/caches/forge_gradle/bundeled_repo/net/minecraftforge/forge

      - name: Cache Forge/Gradle files
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-forge-fg4-${{ hashFiles('**/*.gradle*') }}
          restore-keys: |
            ${{ runner.os }}-forge-fg4-

      - name: Build mod JAR
        working-directory: minecraft-credit-mod
        run: ./gradlew build --no-daemon --stacktrace
        env:
          JAVA_TOOL_OPTIONS: "-Xmx3g"

      - name: Upload mod JAR
        uses: actions/upload-artifact@v4
        with:
          name: creditmod-jar
          path: minecraft-credit-mod/build/libs/creditmod-1.16.5-*.jar
          if-no-files-found: error
          retention-days: 30
